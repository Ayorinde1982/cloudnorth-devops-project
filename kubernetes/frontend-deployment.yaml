apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        # !!! IMPORTANT: REPLACE THIS with your actual frontend ECR image URI !!!
        image: 305767681186.dkr.ecr.us-east-1.amazonaws.com/cloudnorth-frontend:latest
        ports:
        - containerPort: 80 # The port Nginx listens on inside the container
